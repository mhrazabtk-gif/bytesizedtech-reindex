name: Hourly Site Re-indexing

on:
  schedule:
    - cron: '0 * * * *' # Runs at minute 0 of every hour
  workflow_dispatch:

jobs:
  reindex-and-deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        run: |
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch origin
          git checkout main || git checkout master

      - name: Generate Sitemap
        run: node build-sitemap.js

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy public --project-name=bytesizedtech --commit-dirty=true

      - name: Send IndexNow Ping
        run: node ping-indexnow.js
